<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alcove - Animation Reference Lookbook</title>
  <style>
/* ==========================================================================
   Alcove Reference Lookbook — Premium Design System
   ========================================================================== */

/* --- Custom Properties --- */
:root {
  --bg:           oklch(0.15 0.01 260);
  --bg-card:      oklch(0.18 0.012 260);
  --bg-hover:     oklch(0.22 0.015 260);
  --text:         oklch(0.92 0.01 260);
  --text-muted:   oklch(0.62 0.01 260);
  --accent:       oklch(0.65 0.15 270);
  --accent-hover: oklch(0.72 0.15 270);
  --accent-dim:   oklch(0.35 0.08 270);
  --heart:        oklch(0.65 0.2 15);
  --heart-glow:   oklch(0.55 0.25 15);
  --border:       oklch(0.25 0.01 260);
  --border-hover: oklch(0.32 0.02 260);
  --glass-bg:     rgba(255, 255, 255, 0.06);
  --glass-border: rgba(255, 255, 255, 0.08);
  --radius:       12px;
  --radius-lg:    16px;
  --spring:       cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out:     cubic-bezier(0, 0, 0.2, 1);
  --ease-std:     cubic-bezier(0.4, 0, 0.2, 1);
  --content-max:  1400px;
  --side-pad:     clamp(16px, 4vw, 48px);
  --section-gap:  clamp(48px, 8vh, 96px);
}

/* --- Reset --- */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* --- Base --- */
html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  letter-spacing: 0.01em;
  overflow-x: hidden;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(108, 99, 255, 0.12) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(255, 71, 87, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(108, 99, 255, 0.08) 0%, transparent 40%);
  background-attachment: fixed;
}

/* --- Glass Morphism Utility --- */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid var(--glass-border);
}

/* --- Scroll-Driven Animations --- */
@keyframes fadeSlideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.scroll-reveal {
  animation: fadeSlideUp ease-out both;
  animation-timeline: view();
  animation-range: entry 0% cover 25%;
}

/* Fallback for browsers without scroll-driven animations */
@supports not (animation-timeline: view()) {
  .scroll-reveal {
    animation: none;
  }
  .scroll-reveal.in-view {
    animation: fadeSlideUpFallback 0.6s var(--ease-out) both;
  }
  .scroll-reveal:not(.in-view) {
    opacity: 0;
    transform: translateY(30px);
  }
}

@keyframes fadeSlideUpFallback {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ==========================================================================
   Header
   ========================================================================== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  border-radius: 0;
  border-left: none;
  border-right: none;
  border-top: none;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.header-inner {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 14px var(--side-pad);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.site-title {
  font-size: clamp(16px, 2vw, 20px);
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  flex: 1;
  justify-content: flex-end;
}

/* --- Filter Bar --- */
.filter-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.filter-btn {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--glass-border);
  color: var(--text-muted);
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s var(--ease-std);
  white-space: nowrap;
  letter-spacing: 0.01em;
}

.filter-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text);
  border-color: rgba(255, 255, 255, 0.15);
  transform: scale(1.05);
}

.filter-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 2px 12px rgba(108, 99, 255, 0.35);
}

.filter-btn .filter-count {
  display: inline-block;
  margin-left: 4px;
  opacity: 0.6;
  font-size: 11px;
}

/* --- Header Actions --- */
.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.film-count {
  font-size: 13px;
  color: var(--text-muted);
  white-space: nowrap;
  padding: 4px 0;
}

.fav-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(255, 71, 87, 0.1);
  border: 1px solid rgba(255, 71, 87, 0.2);
  color: var(--heart);
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: default;
  transition: all 0.2s var(--ease-std);
}

.fav-badge svg {
  width: 14px;
  height: 14px;
}

.compare-btn {
  display: none;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  color: white;
  border: none;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s var(--spring);
  letter-spacing: 0.01em;
}

.compare-btn:hover {
  background: var(--accent-hover);
  transform: scale(1.05);
  box-shadow: 0 4px 16px rgba(108, 99, 255, 0.4);
}

.compare-btn.visible {
  display: inline-flex;
}

/* ==========================================================================
   Films Container
   ========================================================================== */
.films-container {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--section-gap) var(--side-pad);
  display: flex;
  flex-direction: column;
  gap: var(--section-gap);
}

/* ==========================================================================
   Film Card / Section
   ========================================================================== */
.film-section {
  content-visibility: auto;
  contain-intrinsic-size: auto 400px;
}

.film-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  overflow: hidden;
  transition: border-color 0.3s var(--ease-std), box-shadow 0.3s var(--ease-std);
}

.film-card:hover {
  border-color: var(--border-hover);
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
}

/* --- Film Header --- */
.film-header {
  padding: 24px 28px 8px;
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
}

.film-title {
  font-size: clamp(22px, 3vw, 30px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.studio-tag {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  background: rgba(108, 99, 255, 0.12);
  padding: 3px 10px;
  border-radius: 10px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: all 0.2s var(--ease-std);
}

.film-card:hover .studio-tag {
  background: rgba(108, 99, 255, 0.18);
}

/* --- Style Description --- */
.style-desc {
  padding: 8px 28px 20px;
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.7;
  max-width: 780px;
  letter-spacing: 0.01em;
}

/* ==========================================================================
   Carousel
   ========================================================================== */
.carousel-wrapper {
  position: relative;
  padding: 0 28px 24px;
}

/* Edge gradient fades */
.carousel-wrapper::before,
.carousel-wrapper::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 24px;
  width: 48px;
  z-index: 2;
  pointer-events: none;
  transition: opacity 0.3s;
}

.carousel-wrapper::before {
  left: 28px;
  background: linear-gradient(to right, var(--bg-card) 0%, transparent 100%);
  opacity: 0;
}

.carousel-wrapper::after {
  right: 28px;
  background: linear-gradient(to left, var(--bg-card) 0%, transparent 100%);
}

.carousel-wrapper.scrolled-start::before {
  opacity: 1;
}

.carousel-wrapper.scrolled-end::after {
  opacity: 0;
}

.carousel {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scroll-padding: 24px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 4px 0;
}

.carousel::-webkit-scrollbar {
  display: none;
}

/* --- Carousel Item --- */
.carousel-item {
  position: relative;
  flex-shrink: 0;
  scroll-snap-align: start;
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s var(--spring), box-shadow 0.3s var(--ease-std);
  aspect-ratio: 16 / 9;
  height: 280px;
  width: auto;
}

.carousel-item:hover {
  transform: scale(1.03);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  z-index: 1;
}

.carousel-item img {
  display: block;
  height: 100%;
  width: auto;
  object-fit: cover;
  transition: filter 0.3s var(--ease-std);
}

.carousel-item:hover img {
  filter: brightness(1.1);
}

/* Image loaded state */
.carousel-item .img-loading {
  background: oklch(0.2 0.01 260);
}

.carousel-item img {
  opacity: 0;
  transition: opacity 0.4s ease, filter 0.3s var(--ease-std);
}

.carousel-item img.loaded {
  opacity: 1;
}

/* --- Stagger animation for carousel items --- */
.carousel-item {
  animation: fadeSlideUp 0.5s var(--ease-out) both;
  animation-delay: calc(var(--i, 0) * 60ms);
  animation-timeline: view();
  animation-range: entry 0% cover 30%;
}

@supports not (animation-timeline: view()) {
  .carousel-item {
    animation: none;
    opacity: 1;
  }
}

/* --- Favorite Button --- */
.fav-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.5);
  font-size: 16px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.25s var(--spring);
  z-index: 3;
}

.carousel-item:hover .fav-btn {
  opacity: 1;
  transform: scale(1);
}

.fav-btn:hover {
  background: rgba(0, 0, 0, 0.75);
  color: rgba(255, 255, 255, 0.8);
  transform: scale(1.1) !important;
}

.fav-btn.favorited {
  color: var(--heart);
  opacity: 1;
  transform: scale(1);
  border-color: rgba(255, 71, 87, 0.3);
  background: rgba(255, 71, 87, 0.15);
}

.fav-btn.favorited:hover {
  background: rgba(255, 71, 87, 0.25);
  transform: scale(1.1) !important;
}

@keyframes heartPop {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.35); }
  60%  { transform: scale(0.95); }
  100% { transform: scale(1); }
}

.fav-btn.pop {
  animation: heartPop 0.4s var(--spring);
}

.fav-btn svg {
  width: 16px;
  height: 16px;
  pointer-events: none;
}

/* ==========================================================================
   Lightbox
   ========================================================================== */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s var(--ease-std), visibility 0.3s;
}

.lightbox.open {
  opacity: 1;
  visibility: visible;
}

.lightbox-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.lightbox-img-wrapper {
  position: relative;
  z-index: 1;
  max-width: 90vw;
  max-height: 85vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lightbox-img-wrapper img {
  max-width: 90vw;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 16px 64px rgba(0, 0, 0, 0.5);
  transform: scale(0.92);
  opacity: 0;
  transition: transform 0.45s var(--spring), opacity 0.35s var(--ease-out);
}

.lightbox.open .lightbox-img-wrapper img {
  transform: scale(1);
  opacity: 1;
}

.lightbox-close {
  position: absolute;
  top: 20px;
  right: 24px;
  z-index: 10;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text-muted);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s var(--spring);
}

.lightbox-close:hover {
  background: rgba(255, 255, 255, 0.15);
  color: var(--text);
  transform: scale(1.1);
}

/* --- Lightbox Navigation --- */
.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.7);
  width: 52px;
  height: 52px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s var(--spring);
}

.lightbox-nav:hover {
  background: rgba(255, 255, 255, 0.18);
  color: white;
  transform: translateY(-50%) scale(1.1);
}

.lightbox-prev { left: 20px; }
.lightbox-next { right: 20px; }

/* --- Lightbox Info Bar --- */
.lightbox-info {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  border-radius: 14px;
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.lightbox-counter {
  color: var(--text-muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

/* ==========================================================================
   Compare Panel
   ========================================================================== */
.compare-panel {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  opacity: 0;
  visibility: hidden;
  transform: translateY(20px);
  transition: opacity 0.35s var(--ease-out), visibility 0.35s, transform 0.35s var(--ease-out);
}

.compare-panel.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.compare-header {
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-radius: 0;
  border-left: none;
  border-right: none;
  border-top: none;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  flex-shrink: 0;
}

.compare-header h2 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.compare-close {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s var(--spring);
}

.compare-close:hover {
  background: rgba(255, 255, 255, 0.12);
  color: var(--text);
  transform: scale(1.1);
}

.compare-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 20px;
  padding: 24px;
  overflow-y: auto;
  align-content: start;
}

.compare-cell {
  position: relative;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--border);
  transition: border-color 0.3s var(--ease-std), transform 0.3s var(--spring);
}

.compare-cell:hover {
  border-color: var(--border-hover);
  transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.compare-cell img {
  width: 100%;
  height: auto;
  display: block;
  aspect-ratio: 16 / 9;
  object-fit: cover;
}

.compare-cell .compare-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 16px;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.01em;
}

/* ==========================================================================
   Hidden state for filtered films
   ========================================================================== */
.film-section.hidden {
  display: none;
}

/* ==========================================================================
   Responsive
   ========================================================================== */
@media (max-width: 900px) {
  .header-inner {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  .header-controls {
    width: 100%;
    justify-content: flex-start;
  }

  .filter-bar {
    width: 100%;
    overflow-x: auto;
    flex-wrap: nowrap;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }

  .filter-bar::-webkit-scrollbar {
    display: none;
  }
}

@media (max-width: 768px) {
  .carousel-item {
    height: 200px;
  }

  .film-header {
    padding: 20px 20px 6px;
  }

  .style-desc {
    padding: 6px 20px 16px;
  }

  .carousel-wrapper {
    padding: 0 20px 20px;
  }

  .carousel-wrapper::before {
    left: 20px;
  }

  .carousel-wrapper::after {
    right: 20px;
  }

  .compare-grid {
    grid-template-columns: 1fr;
    padding: 16px;
  }

  .lightbox-nav {
    width: 40px;
    height: 40px;
  }

  .lightbox-prev { left: 10px; }
  .lightbox-next { right: 10px; }
}

@media (max-width: 480px) {
  .carousel-item {
    height: 160px;
  }

  .film-title {
    font-size: 20px;
  }
}

/* ==========================================================================
   Focus Styles (Accessibility)
   ========================================================================== */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button:focus:not(:focus-visible) {
  outline: none;
}

/* ==========================================================================
   Selection Color
   ========================================================================== */
::selection {
  background: rgba(108, 99, 255, 0.3);
  color: white;
}

  </style>
</head>
<body>

  <header class="header glass" id="header">
    <div class="header-inner">
      <h1 class="site-title">Alcove Reference Lookbook</h1>
      <div class="header-controls">
        <nav id="filter-bar" class="filter-bar" aria-label="Studio filters"></nav>
        <div class="header-actions">
          <span id="film-count" class="film-count">0 films</span>
          <button id="fav-count-badge" class="fav-badge" aria-label="Favorites count">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span id="fav-count-num">0</span>
          </button>
          <button id="compare-btn" class="compare-btn" aria-label="Compare favorites">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
            </svg>
            Compare
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="films-container" class="films-container"></main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="lightbox-backdrop"></div>

  <script>
/* ==========================================================================
   Alcove Reference Lookbook — Application Logic
   ========================================================================== */
(function () {
  'use strict';

  // ---- Constants ----
  const STORAGE_KEY = 'alcove-favorites';
  const HEART_SVG_OUTLINE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
  const HEART_SVG_FILLED = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';

  // ---- State ----
  let favorites = [];
  try {
    favorites = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (!Array.isArray(favorites)) favorites = [];
  } catch (e) {
    favorites = [];
  }

  let filmData = [];
  let activeFilter = 'All';

  // ---- DOM References (cached after init) ----
  let $filmsContainer;
  let $filterBar;
  let $filmCount;
  let $compareBtn;
  let $favCountNum;
  let $lightbox;
  let $lightboxImg;
  let $lightboxTitle;
  let $lightboxCounter;
  let $comparePanel;
  let $compareGrid;

  // ==========================================================================
  // Favorites
  // ==========================================================================
  function saveFavorites() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
    updateFavBadge();
    updateCompareBtn();
  }

  function isFavorited(imageId) {
    return favorites.indexOf(imageId) !== -1;
  }

  function toggleFavorite(imageId) {
    const idx = favorites.indexOf(imageId);
    if (idx === -1) {
      favorites.push(imageId);
    } else {
      favorites.splice(idx, 1);
    }
    saveFavorites();

    // Update all fav buttons for this image
    const btns = document.querySelectorAll('.fav-btn[data-id="' + imageId + '"]');
    btns.forEach(function (btn) {
      const nowFav = isFavorited(imageId);
      btn.classList.toggle('favorited', nowFav);
      btn.innerHTML = nowFav ? HEART_SVG_FILLED : HEART_SVG_OUTLINE;
      // Pop animation
      btn.classList.remove('pop');
      void btn.offsetWidth; // force reflow
      if (nowFav) btn.classList.add('pop');
    });
  }

  function updateFavBadge() {
    if ($favCountNum) {
      $favCountNum.textContent = favorites.length;
    }
  }

  function updateCompareBtn() {
    if (!$compareBtn) return;
    if (favorites.length >= 2) {
      $compareBtn.classList.add('visible');
    } else {
      $compareBtn.classList.remove('visible');
    }
  }

  // ==========================================================================
  // Lightbox
  // ==========================================================================
  let lightboxImages = [];
  let lightboxIndex = 0;

  function openLightbox(images, index) {
    lightboxImages = images;
    lightboxIndex = index;
    showLightboxImage();
    $lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    $lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function showLightboxImage() {
    const item = lightboxImages[lightboxIndex];
    if (!item) return;

    // Reset animation state
    $lightboxImg.style.transition = 'none';
    $lightboxImg.style.transform = 'scale(0.92)';
    $lightboxImg.style.opacity = '0';

    $lightboxImg.src = item.fullres;
    $lightboxImg.alt = item.film + ' reference image';
    $lightboxTitle.textContent = item.film;
    $lightboxCounter.textContent = (lightboxIndex + 1) + ' / ' + lightboxImages.length;

    // Trigger spring entrance
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        $lightboxImg.style.transition = 'transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s cubic-bezier(0, 0, 0.2, 1)';
        $lightboxImg.style.transform = 'scale(1)';
        $lightboxImg.style.opacity = '1';
      });
    });
  }

  function lightboxPrev() {
    lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
    showLightboxImage();
  }

  function lightboxNext() {
    lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
    showLightboxImage();
  }

  // ==========================================================================
  // Compare
  // ==========================================================================
  function openCompare() {
    $compareGrid.innerHTML = '';

    favorites.forEach(function (id) {
      const parts = id.split('/');
      const slug = parts[0];
      const num = parseInt(parts[1], 10);
      const film = filmData.find(function (f) { return f.slug === slug; });
      if (!film) return;

      const img = film.images.find(function (i) { return i.num === num; });
      if (!img) return;

      var cell = document.createElement('div');
      cell.className = 'compare-cell';
      cell.innerHTML =
        '<img src="' + img.fullres + '" alt="' + film.title + '" loading="lazy" decoding="async">' +
        '<div class="compare-label">' + film.title + '</div>';
      $compareGrid.appendChild(cell);
    });

    $comparePanel.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeCompare() {
    $comparePanel.classList.remove('open');
    document.body.style.overflow = '';
  }

  // ==========================================================================
  // Filters
  // ==========================================================================
  function setFilter(studio) {
    activeFilter = studio;
    var btns = document.querySelectorAll('.filter-btn');
    btns.forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.studio === studio);
    });

    var sections = document.querySelectorAll('.film-section');
    var visibleCount = 0;
    sections.forEach(function (section) {
      if (studio === 'All' || section.dataset.studio === studio) {
        section.classList.remove('hidden');
        visibleCount++;
      } else {
        section.classList.add('hidden');
      }
    });

    $filmCount.textContent = visibleCount + ' film' + (visibleCount !== 1 ? 's' : '');
  }

  // ==========================================================================
  // Carousel Scroll Edge Detection
  // ==========================================================================
  function setupCarouselEdges(carousel) {
    var wrapper = carousel.parentElement;

    function updateEdges() {
      var scrollLeft = carousel.scrollLeft;
      var maxScroll = carousel.scrollWidth - carousel.clientWidth;

      if (scrollLeft > 10) {
        wrapper.classList.add('scrolled-start');
      } else {
        wrapper.classList.remove('scrolled-start');
      }

      if (scrollLeft >= maxScroll - 10) {
        wrapper.classList.add('scrolled-end');
      } else {
        wrapper.classList.remove('scrolled-end');
      }
    }

    carousel.addEventListener('scroll', updateEdges, { passive: true });
    // Initial check
    updateEdges();
  }

  // ==========================================================================
  // Render
  // ==========================================================================
  function renderFilm(film) {
    var section = document.createElement('section');
    section.className = 'film-section scroll-reveal';
    section.dataset.studio = film.studio;

    var card = document.createElement('div');
    card.className = 'film-card';

    // Header
    var header = document.createElement('div');
    header.className = 'film-header';
    header.innerHTML =
      '<h2 class="film-title">' + escapeHtml(film.title) + '</h2>' +
      '<span class="studio-tag">' + escapeHtml(film.studio) + '</span>';

    // Style description
    var desc = document.createElement('p');
    desc.className = 'style-desc';
    desc.textContent = film.styleDesc || '';

    // Carousel
    var carouselWrapper = document.createElement('div');
    carouselWrapper.className = 'carousel-wrapper';

    var carousel = document.createElement('div');
    carousel.className = 'carousel';

    film.images.forEach(function (img, i) {
      var id = film.slug + '/' + img.num;
      var fav = isFavorited(id);

      var item = document.createElement('div');
      item.className = 'carousel-item';
      item.style.setProperty('--i', i);
      item.dataset.index = i;

      var imgEl = document.createElement('img');
      imgEl.src = img.thumb;
      imgEl.alt = film.title + ' reference ' + (i + 1);
      imgEl.loading = 'lazy';
      imgEl.decoding = 'async';

      // Image loaded transition
      imgEl.addEventListener('load', function () {
        imgEl.classList.add('loaded');
      });

      // If already cached
      if (imgEl.complete && imgEl.naturalWidth > 0) {
        imgEl.classList.add('loaded');
      }

      var favBtn = document.createElement('button');
      favBtn.className = 'fav-btn' + (fav ? ' favorited' : '');
      favBtn.dataset.id = id;
      favBtn.setAttribute('aria-label', 'Toggle favorite');
      favBtn.innerHTML = fav ? HEART_SVG_FILLED : HEART_SVG_OUTLINE;

      favBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleFavorite(id);
      });

      item.addEventListener('click', function (e) {
        if (e.target.closest('.fav-btn')) return;
        var allImages = film.images.map(function (im) {
          return { fullres: im.fullres, film: film.title };
        });
        openLightbox(allImages, i);
      });

      item.appendChild(imgEl);
      item.appendChild(favBtn);
      carousel.appendChild(item);
    });

    carouselWrapper.appendChild(carousel);

    card.appendChild(header);
    card.appendChild(desc);
    card.appendChild(carouselWrapper);
    section.appendChild(card);

    // Setup carousel edge detection after appending
    requestAnimationFrame(function () {
      setupCarouselEdges(carousel);
    });

    return section;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderAll() {
    $filmsContainer.innerHTML = '';

    var fragment = document.createDocumentFragment();
    filmData.forEach(function (film) {
      fragment.appendChild(renderFilm(film));
    });
    $filmsContainer.appendChild(fragment);

    $filmCount.textContent = filmData.length + ' films';
    updateFavBadge();
    updateCompareBtn();

    // Setup scroll-reveal fallback for browsers without CSS scroll-driven animations
    setupScrollRevealFallback();
  }

  // ==========================================================================
  // Scroll Reveal Fallback (IntersectionObserver)
  // ==========================================================================
  function setupScrollRevealFallback() {
    // Test if scroll-driven animations are supported
    if (CSS.supports && CSS.supports('animation-timeline', 'view()')) {
      return; // Native support, no fallback needed
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.05,
      rootMargin: '0px 0px -50px 0px'
    });

    document.querySelectorAll('.scroll-reveal').forEach(function (el) {
      observer.observe(el);
    });
  }

  // ==========================================================================
  // Build Filter Pills
  // ==========================================================================
  function buildFilters() {
    // Count films per studio
    var studioCounts = {};
    filmData.forEach(function (film) {
      studioCounts[film.studio] = (studioCounts[film.studio] || 0) + 1;
    });

    var studios = ['All'].concat(Object.keys(studioCounts).sort());

    studios.forEach(function (studio) {
      var btn = document.createElement('button');
      btn.className = 'filter-btn' + (studio === 'All' ? ' active' : '');
      btn.dataset.studio = studio;

      var label = studio;
      if (studio === 'All') {
        label = 'All';
        btn.innerHTML = label + '<span class="filter-count">' + filmData.length + '</span>';
      } else {
        btn.innerHTML = label + '<span class="filter-count">' + studioCounts[studio] + '</span>';
      }

      btn.addEventListener('click', function () {
        setFilter(studio);
      });

      $filterBar.appendChild(btn);
    });
  }

  // ==========================================================================
  // Event Listeners
  // ==========================================================================
  function setupEventListeners() {
    // Compare
    $compareBtn.addEventListener('click', openCompare);
    document.getElementById('compare-close').addEventListener('click', closeCompare);

    // Lightbox backdrop click
    $lightbox.querySelector('.lightbox-backdrop').addEventListener('click', closeLightbox);

    // Lightbox close button
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);

    // Lightbox navigation
    document.getElementById('lightbox-prev').addEventListener('click', function (e) {
      e.stopPropagation();
      lightboxPrev();
    });

    document.getElementById('lightbox-next').addEventListener('click', function (e) {
      e.stopPropagation();
      lightboxNext();
    });

    // Keyboard navigation
    document.addEventListener('keydown', function (e) {
      // Lightbox keyboard controls
      if ($lightbox.classList.contains('open')) {
        if (e.key === 'Escape') {
          closeLightbox();
          e.preventDefault();
        }
        if (e.key === 'ArrowLeft') {
          lightboxPrev();
          e.preventDefault();
        }
        if (e.key === 'ArrowRight') {
          lightboxNext();
          e.preventDefault();
        }
        return;
      }

      // Compare panel keyboard controls
      if ($comparePanel.classList.contains('open')) {
        if (e.key === 'Escape') {
          closeCompare();
          e.preventDefault();
        }
      }
    });
  }

  // ==========================================================================
  // Init
  // ==========================================================================
  async function init() {
    // Cache DOM references
    $filmsContainer = document.getElementById('films-container');
    $filterBar = document.getElementById('filter-bar');
    $filmCount = document.getElementById('film-count');
    $compareBtn = document.getElementById('compare-btn');
    $favCountNum = document.getElementById('fav-count-num');
    $lightbox = document.getElementById('lightbox');
    $lightboxImg = document.getElementById('lightbox-img');
    $lightboxTitle = document.getElementById('lightbox-title');
    $lightboxCounter = document.getElementById('lightbox-counter');
    $comparePanel = document.getElementById('compare-panel');
    $compareGrid = document.getElementById('compare-grid');

    // Data embedded inline
    filmData = window.__ALCOVE_DATA__;

    // Render everything
    renderAll();
    buildFilters();
    setupEventListeners();
  }

  // Start
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();

  </script>

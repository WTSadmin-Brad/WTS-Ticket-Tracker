<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alcove - Animation Reference Lookbook</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header glass" id="header">
    <div class="header-inner">
      <h1 class="site-title">Alcove Reference Lookbook</h1>
      <div class="header-controls">
        <nav id="filter-bar" class="filter-bar" aria-label="Studio filters"></nav>
        <div class="header-actions">
          <span id="film-count" class="film-count">0 films</span>
          <button id="fav-count-badge" class="fav-badge" aria-label="Favorites count">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span id="fav-count-num">0</span>
          </button>
          <button id="compare-btn" class="compare-btn" aria-label="Compare favorites">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
            </svg>
            Compare
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="films-container" class="films-container"></main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="lightbox-backdrop"></div>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close lightbox">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="lightbox-img-wrapper">
      <img id="lightbox-img" src="" alt="Full resolution image">
    </div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
    <div class="lightbox-info glass" id="lightbox-info">
      <span id="lightbox-title"></span>
      <span id="lightbox-counter" class="lightbox-counter"></span>
    </div>
  </div>

  <!-- Compare Panel -->
  <div id="compare-panel" class="compare-panel" role="dialog" aria-modal="true" aria-label="Compare favorites">
    <header class="compare-header glass">
      <h2>Compare Favorites</h2>
      <button id="compare-close" class="compare-close" aria-label="Close compare view">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </header>
    <div id="compare-grid" class="compare-grid"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
